<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="navbar navbar-expand-lg gs-navbar sticky-top" th:fragment="header">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">
            <i class="bi bi-controller me-1"></i>GamerStore
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <form class="d-flex me-lg-3 my-2 my-lg-0" th:action="@{/productos}" method="get" style="flex:1; max-width: 360px;">
                <input type="search" name="q" class="form-control gs-form-control"
                       placeholder="Buscar productos..." th:value="${busqueda}">
            </form>
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/productos}">Catálogo</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/contacto}">Contacto</a></li>
                <th:block th:if="${session.username != null}">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="bi bi-shield-lock me-1"></i>
                            <span th:text="${nombreCompleto}">Admin</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" th:href="@{/admin}"><i class="bi bi-speedometer2 me-2"></i>Panel ERP</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/auth/logout}" method="post" style="display:inline;">
                                    <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Cerrar Sesión</button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </th:block>
                <th:block th:unless="${session.username != null}">
                    <li class="nav-item ms-lg-2">
                        <a class="btn btn-neon-outline btn-neon-sm" th:href="@{/auth/login}">
                            <i class="bi bi-shield-lock me-1"></i> Admin
                        </a>
                    </li>
                </th:block>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
