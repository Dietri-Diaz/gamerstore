<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin — GamerStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body style="background: var(--bg);">

<section style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="gs-card" style="overflow: hidden; box-shadow: var(--shadow-lg);">
                    <div class="row g-0">
                        <!-- LADO IZQUIERDO -->
                        <div class="col-md-5 d-none d-md-flex flex-column justify-content-center align-items-center text-center p-5"
                             style="background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%); color: #fff;">
                            <i class="bi bi-shield-lock" style="font-size: 4rem; opacity: 0.95;"></i>
                            <h2 class="mt-3" style="color: #fff; font-size: 1.6rem;">Panel ERP</h2>
                            <p class="mt-2" style="opacity: 0.9;">Acceso exclusivo para administradores de GamerStore.</p>
                            <a th:href="@{/}" class="mt-4 text-white text-decoration-none" style="opacity: 0.85; font-size: .9rem;">
                                <i class="bi bi-arrow-left me-1"></i>Volver a la tienda
                            </a>
                        </div>

                        <!-- LADO DERECHO: FORMULARIO -->
                        <div class="col-md-7 p-4 p-md-5">
                            <h1 style="font-size: 1.5rem;">
                                <i class="bi bi-controller me-2" style="color: var(--accent);"></i>GamerStore
                            </h1>
                            <p class="text-muted mb-4">Inicia sesión para gestionar productos, clientes y ventas.</p>

                            <div th:if="${loginError}" class="alert mb-3" role="alert"
                                 style="background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; border-radius: 8px;">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                                <span th:text="${loginError}">Error</span>
                            </div>

                            <form th:action="@{/auth/login-custom}" method="post">
                                <div class="mb-3">
                                    <label class="form-label">Usuario o Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-person-fill"></i>
                                        </span>
                                        <input type="text" name="username" class="form-control gs-form-control"
                                               placeholder="admin123" required autofocus>
                                    </div>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label">Contraseña</label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="bi bi-lock-fill"></i>
                                        </span>
                                        <input type="password" name="password" class="form-control gs-form-control"
                                               placeholder="••••••••" required>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-neon w-100 btn-lg">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar al ERP
                                </button>
                            </form>

                            <div class="mt-4 p-3" style="background: var(--bg-2); border: 1px dashed var(--border-strong); border-radius: 8px; font-size: .85rem;">
                                <strong style="color: var(--accent);"><i class="bi bi-info-circle me-1"></i>Demo:</strong>
                                <div class="mt-1 text-muted">
                                    Usuario: <code style="color: var(--text-strong);">admin123</code> ·
                                    Contraseña: <code style="color: var(--text-strong);">gamerstore123</code>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
