<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo — GamerStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <style>
        .filter-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: var(--shadow-sm);
        }
        .filter-card h5 {
            font-size: .95rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-strong);
        }
        .filter-link {
            display: flex;
            align-items: center;
            gap: .6rem;
            padding: .5rem .75rem;
            color: var(--text);
            border-radius: 8px;
            text-decoration: none;
            font-size: .9rem;
            transition: all .15s;
        }
        .filter-link:hover {
            background: var(--bg-2);
            color: var(--text-strong);
        }
        .filter-link.active {
            background: var(--accent-soft);
            color: var(--accent);
            font-weight: 600;
        }
        .filter-link i {
            font-size: .85rem;
            color: var(--text-muted);
            width: 16px;
        }
        .filter-link.active i { color: var(--accent); }
    </style>
</head>
<body>

<th:block th:replace="~{fragments/header :: header}"></th:block>

<section class="py-5">
    <div class="container">
        <div class="row align-items-center mb-4">
            <div class="col-md-8">
                <span class="hero-eyebrow"><i class="bi bi-grid-3x3-gap-fill me-1"></i> Catálogo completo</span>
                <h1 class="mt-2" style="font-size: 1.8rem;">
                    Encuentra tu <span style="color: var(--accent);">arma ideal</span>
                </h1>
                <p class="text-muted mb-0" th:if="${busqueda}">
                    Resultados para: <strong th:text="${busqueda}" style="color: var(--text-strong);"></strong>
                </p>
            </div>
            <div class="col-md-4 text-md-end mt-3 mt-md-0">
                <span class="badge-neon">
                    <i class="bi bi-box-seam me-1"></i>
                    <span th:text="${#lists.size(productos)}">0</span> productos
                </span>
            </div>
        </div>

        <div class="row g-4">
            <!-- SIDEBAR FILTROS -->
            <aside class="col-lg-3">
                <div class="filter-card">
                    <h5><i class="bi bi-funnel me-1" style="color: var(--accent);"></i>Filtros</h5>

                    <form th:action="@{/productos}" method="get" class="mb-3">
                        <label class="form-label">Búsqueda</label>
                        <input type="search" name="q" class="form-control gs-form-control"
                               placeholder="Nombre del producto..."
                               th:value="${busqueda}">
                        <button type="submit" class="btn btn-neon w-100 mt-2 btn-neon-sm">
                            <i class="bi bi-search me-1"></i>Buscar
                        </button>
                    </form>

                    <hr style="border-color: var(--border);">

                    <label class="form-label">Categorías</label>
                    <div class="d-flex flex-column gap-1">
                        <a th:href="@{/productos}"
                           class="filter-link"
                           th:classappend="${categoriaActiva == null} ? 'active' : ''">
                            <i class="bi bi-grid"></i><span>Todas</span>
                        </a>
                        <a th:each="c : ${categorias}"
                           th:href="@{/productos(categoria=${c})}"
                           class="filter-link"
                           th:classappend="${categoriaActiva != null and categoriaActiva.equalsIgnoreCase(c)} ? 'active' : ''">
                            <i class="bi bi-tag"></i><span th:text="${c}">Cat</span>
                        </a>
                    </div>
                </div>
            </aside>

            <!-- GRID DE PRODUCTOS -->
            <div class="col-lg-9">
                <div th:if="${#lists.isEmpty(productos)}" class="text-center py-5">
                    <i class="bi bi-search" style="font-size: 3rem; color: var(--text-muted); opacity: .4;"></i>
                    <h3 class="mt-3" style="font-size: 1.2rem;">Sin resultados</h3>
                    <p class="text-muted">Intenta con otra búsqueda o categoría.</p>
                </div>

                <div class="row g-4">
                    <div class="col-sm-6 col-lg-4" th:each="p : ${productos}">
                        <a th:href="@{/productos/{id}(id=${p.id})}" class="text-decoration-none">
                            <div class="gs-card card">
                                <img th:src="${p.imagen}" th:alt="${p.nombre}">
                                <div class="card-body d-flex flex-column">
                                    <span class="badge-cat mb-2 align-self-start" th:text="${p.categoria.nombre}">Cat</span>
                                    <h5 class="card-title" th:text="${p.nombre}">Nombre</h5>
                                    <p class="card-text flex-grow-1" th:text="${p.descripcion}">Desc</p>
                                    <div class="d-flex justify-content-between align-items-center mt-2">
                                        <span class="price" th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">S/ 0</span>
                                        <span class="badge-neon"><i class="bi bi-eye"></i></span>
                                    </div>
                                </div>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
