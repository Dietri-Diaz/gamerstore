<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes — GamerStore ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="admin-body">

<div class="admin-layout">
    <th:block th:replace="~{admin/fragments/sidebar :: sidebar}"></th:block>

    <div class="admin-main">
        <th:block th:replace="~{admin/fragments/topbar :: topbar}"></th:block>

        <main class="admin-content">
            <div th:if="${mensaje}" class="alert mb-3"
                 style="background: #d1fae5; border: 1px solid #a7f3d0; color: #065f46; border-radius: 10px;">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensaje}">OK</span>
            </div>
            <div th:if="${error}" class="alert mb-3"
                 style="background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; border-radius: 10px;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="mb-1" style="font-size: 1.4rem;">Clientes</h2>
                    <p class="text-muted mb-0">Base de datos de clientes de la tienda</p>
                </div>
                <button class="btn btn-neon" data-bs-toggle="modal" data-bs-target="#modalNuevo">
                    <i class="bi bi-person-plus me-1"></i>Nuevo cliente
                </button>
            </div>

            <div class="dash-panel p-0">
                <div class="table-responsive">
                    <table class="table gs-table mb-0">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>DNI</th>
                                <th>Contacto</th>
                                <th>Dirección</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${clientes}">
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="admin-userchip-avatar" style="width: 38px; height: 38px;">
                                            <i class="bi bi-person-fill"></i>
                                        </div>
                                        <div>
                                            <div class="fw-bold" th:text="${c.nombreCompleto}">Nombre</div>
                                            <small class="text-muted" th:text="${c.email != null ? c.email : 'sin email'}">email</small>
                                        </div>
                                    </div>
                                </td>
                                <td><strong style="color: var(--accent-2); font-family: monospace;" th:text="${c.dni}">00000000</strong></td>
                                <td>
                                    <span th:if="${c.telefono != null}">
                                        <i class="bi bi-telephone-fill me-1" style="color: var(--accent-2);"></i>
                                        <span th:text="${c.telefono}">000</span>
                                    </span>
                                    <span th:unless="${c.telefono != null}" class="text-muted">—</span>
                                </td>
                                <td>
                                    <small th:if="${c.direccion != null}" th:text="${c.direccion}">Dirección</small>
                                    <span th:unless="${c.direccion != null}" class="text-muted">—</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-flex gap-1 justify-content-end">
                                        <button class="btn btn-neon-outline btn-neon-sm"
                                                data-bs-toggle="modal"
                                                th:data-bs-target="'#editar-' + ${c.id}">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <form th:action="@{/admin/clientes/{id}/eliminar(id=${c.id})}" method="post"
                                              onsubmit="return confirm('¿Eliminar cliente?');">
                                            <button type="submit" class="btn btn-neon-outline btn-neon-sm"
                                                    style="border-color: #fecaca; color: #dc2626;">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(clientes)}">
                                <td colspan="5" class="text-center text-muted py-5">
                                    <i class="bi bi-people" style="font-size: 2.5rem; opacity: .5;"></i>
                                    <div class="mt-2">No hay clientes registrados</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modales editar -->
            <div th:each="c : ${clientes}" class="modal fade" th:id="'editar-' + ${c.id}" tabindex="-1">
                <div class="modal-dialog modal-lg">
                    <form th:action="@{/admin/clientes/{id}/actualizar(id=${c.id})}" method="post">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Editar cliente</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">DNI (no editable)</label>
                                        <input type="text" class="form-control gs-form-control" th:value="${c.dni}" disabled>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Teléfono</label>
                                        <input type="text" class="form-control gs-form-control" name="telefono" th:value="${c.telefono}">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Nombres *</label>
                                        <input type="text" class="form-control gs-form-control" name="nombres" th:value="${c.nombres}" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Apellidos *</label>
                                        <input type="text" class="form-control gs-form-control" name="apellidos" th:value="${c.apellidos}" required>
                                    </div>
                                    <div class="col-md-12">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control gs-form-control" name="email" th:value="${c.email}">
                                    </div>
                                    <div class="col-md-12">
                                        <label class="form-label">Dirección</label>
                                        <input type="text" class="form-control gs-form-control" name="direccion" th:value="${c.direccion}">
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-neon-outline btn-neon-sm" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-neon"><i class="bi bi-check2 me-1"></i>Guardar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Modal nuevo -->
            <div class="modal fade" id="modalNuevo" tabindex="-1">
                <div class="modal-dialog modal-lg">
                    <form th:action="@{/admin/clientes/crear}" method="post">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title"><i class="bi bi-person-plus me-2"></i>Nuevo cliente</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">DNI *</label>
                                        <input type="text" pattern="[0-9]{8}" maxlength="8"
                                               class="form-control gs-form-control" name="dni"
                                               placeholder="8 dígitos" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Teléfono</label>
                                        <input type="text" class="form-control gs-form-control" name="telefono"
                                               placeholder="9 dígitos">
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Nombres *</label>
                                        <input type="text" class="form-control gs-form-control" name="nombres" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Apellidos *</label>
                                        <input type="text" class="form-control gs-form-control" name="apellidos" required>
                                    </div>
                                    <div class="col-md-12">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control gs-form-control" name="email">
                                    </div>
                                    <div class="col-md-12">
                                        <label class="form-label">Dirección</label>
                                        <input type="text" class="form-control gs-form-control" name="direccion">
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-neon-outline btn-neon-sm" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-neon"><i class="bi bi-plus-circle me-1"></i>Crear</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
