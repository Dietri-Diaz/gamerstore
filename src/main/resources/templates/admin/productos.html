<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos — GamerStore ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="admin-body">

<div class="admin-layout">
    <th:block th:replace="~{admin/fragments/sidebar :: sidebar}"></th:block>

    <div class="admin-main">
        <th:block th:replace="~{admin/fragments/topbar :: topbar}"></th:block>

        <main class="admin-content">
            <!-- Flash messages -->
            <div th:if="${mensaje}" class="alert mb-3"
                 style="background: #d1fae5; border: 1px solid #a7f3d0; color: #065f46; border-radius: 10px;">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensaje}">OK</span>
            </div>
            <div th:if="${error}" class="alert mb-3"
                 style="background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; border-radius: 10px;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
            </div>

            <!-- Header con acción -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="mb-1" style="font-size: 1.4rem;">Catálogo de productos</h2>
                    <p class="text-muted mb-0">Gestiona el inventario de la tienda</p>
                </div>
                <button class="btn btn-neon" data-bs-toggle="modal" data-bs-target="#modalNuevo">
                    <i class="bi bi-plus-circle me-1"></i>Nuevo producto
                </button>
            </div>

            <!-- Tabla -->
            <div class="dash-panel p-0">
                <div class="table-responsive">
                    <table class="table gs-table mb-0">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${productos}">
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <img th:src="${p.imagen}" th:alt="${p.nombre}"
                                             style="width:48px; height:48px; object-fit:cover; border-radius:8px; border:1px solid var(--border);">
                                        <div>
                                            <div class="fw-bold" th:text="${p.nombre}">Producto</div>
                                            <small class="text-muted" th:text="'GS-' + ${p.id}">GS-0</small>
                                        </div>
                                    </div>
                                </td>
                                <td><span class="badge-cat" th:text="${p.categoria.nombre}">Cat</span></td>
                                <td><strong style="color: var(--accent-2);" th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">S/ 0</strong></td>
                                <td>
                                    <span th:if="${p.stock > 10}" class="badge-ok" th:text="${p.stock}">0</span>
                                    <span th:if="${p.stock <= 10 and p.stock > 0}" class="badge-pend" th:text="${p.stock}">0</span>
                                    <span th:if="${p.stock == 0}" style="background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; padding: 4px 12px; border-radius: 20px; font-size: .72rem; font-weight: 600;">Sin stock</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-flex gap-1 justify-content-end">
                                        <button class="btn btn-neon-outline btn-neon-sm"
                                                data-bs-toggle="modal"
                                                th:data-bs-target="'#editar-' + ${p.id}">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <form th:action="@{/admin/productos/{id}/eliminar(id=${p.id})}" method="post"
                                              onsubmit="return confirm('¿Eliminar producto?');">
                                            <button type="submit" class="btn btn-neon-outline btn-neon-sm"
                                                    style="border-color: #fecaca; color: #dc2626;">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(productos)}">
                                <td colspan="5" class="text-center text-muted py-5">
                                    <i class="bi bi-inbox" style="font-size: 2.5rem; opacity: .5;"></i>
                                    <div class="mt-2">No hay productos registrados</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modales editar -->
            <div th:each="p : ${productos}" class="modal fade" th:id="'editar-' + ${p.id}" tabindex="-1">
                <div class="modal-dialog modal-lg">
                    <form th:action="@{/admin/productos/{id}/actualizar(id=${p.id})}" method="post">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Editar producto</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="row g-3">
                                    <div class="col-md-12">
                                        <label class="form-label">Nombre</label>
                                        <input type="text" class="form-control gs-form-control" name="nombre" th:value="${p.nombre}" required>
                                    </div>
                                    <div class="col-md-12">
                                        <label class="form-label">Descripción</label>
                                        <textarea class="form-control gs-form-control" name="descripcion" rows="2" th:text="${p.descripcion}"></textarea>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Precio (S/)</label>
                                        <input type="number" step="0.01" min="0.01" class="form-control gs-form-control" name="precio" th:value="${p.precio}" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Stock</label>
                                        <input type="number" min="0" class="form-control gs-form-control" name="stock" th:value="${p.stock}" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Categoría</label>
                                        <select class="form-select" name="categoriaId">
                                            <option th:each="c : ${categorias}"
                                                    th:value="${c.id}" th:text="${c.nombre}"
                                                    th:selected="${c.id == p.categoria.id}">Cat</option>
                                        </select>
                                    </div>
                                    <div class="col-md-12">
                                        <label class="form-label">URL imagen</label>
                                        <input type="url" class="form-control gs-form-control" name="imagen" th:value="${p.imagen}">
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-neon-outline btn-neon-sm" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-neon"><i class="bi bi-check2 me-1"></i>Guardar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Modal nuevo -->
            <div class="modal fade" id="modalNuevo" tabindex="-1">
                <div class="modal-dialog modal-lg">
                    <form th:action="@{/admin/productos/crear}" method="post">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Nuevo producto</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="row g-3">
                                    <div class="col-md-12">
                                        <label class="form-label">Nombre *</label>
                                        <input type="text" class="form-control gs-form-control" name="nombre" required>
                                    </div>
                                    <div class="col-md-12">
                                        <label class="form-label">Descripción</label>
                                        <textarea class="form-control gs-form-control" name="descripcion" rows="2"></textarea>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Precio (S/) *</label>
                                        <input type="number" step="0.01" min="0.01" class="form-control gs-form-control" name="precio" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Stock *</label>
                                        <input type="number" min="0" class="form-control gs-form-control" name="stock" value="0" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label">Categoría *</label>
                                        <select class="form-select" name="categoriaId" required>
                                            <option value="">— Selecciona —</option>
                                            <option th:each="c : ${categorias}"
                                                    th:value="${c.id}" th:text="${c.nombre}">Cat</option>
                                        </select>
                                    </div>
                                    <div class="col-md-12">
                                        <label class="form-label">URL imagen</label>
                                        <input type="url" class="form-control gs-form-control" name="imagen"
                                               placeholder="https://...">
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-neon-outline btn-neon-sm" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-neon"><i class="bi bi-plus-circle me-1"></i>Crear</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
