<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header class="admin-topbar" th:fragment="topbar">
    <div>
        <h1 class="admin-topbar-title" th:text="${tituloModulo}">Módulo</h1>
        <span class="admin-topbar-sub">Panel administrativo</span>
    </div>
    <div class="admin-topbar-right">
        <div class="dropdown">
            <button class="admin-userchip dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <div class="admin-userchip-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <div class="text-start d-none d-md-block">
                    <div class="admin-userchip-name" th:text="${adminNombre}">Administrador</div>
                    <div class="admin-userchip-role">Admin</div>
                </div>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" th:href="@{/}"><i class="bi bi-shop me-2"></i>Ver tienda</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/auth/logout}" method="post" style="display:inline;">
                        <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>
</body>
</html>
