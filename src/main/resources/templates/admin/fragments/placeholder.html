<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div class="admin-placeholder" th:fragment="comingSoon(modulo, descripcion, icono)">
    <div class="admin-placeholder-icon">
        <i th:class="'bi bi-' + ${icono}"></i>
    </div>
    <h2 th:text="${modulo}">Modulo</h2>
    <p th:text="${descripcion}">Descripcion del modulo</p>
    <span class="badge-ok"><i class="bi bi-tools me-1"></i>Proximamente</span>
</div>
</body>
</html>
