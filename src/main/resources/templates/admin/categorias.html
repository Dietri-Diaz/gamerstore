<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías — GamerStore ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="admin-body">

<div class="admin-layout">
    <th:block th:replace="~{admin/fragments/sidebar :: sidebar}"></th:block>

    <div class="admin-main">
        <th:block th:replace="~{admin/fragments/topbar :: topbar}"></th:block>

        <main class="admin-content">
            <div th:if="${mensaje}" class="alert mb-3"
                 style="background: #d1fae5; border: 1px solid #a7f3d0; color: #065f46; border-radius: 10px;">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${mensaje}">OK</span>
            </div>
            <div th:if="${error}" class="alert mb-3"
                 style="background: #fee2e2; border: 1px solid #fecaca; color: #991b1b; border-radius: 10px;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Error</span>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="mb-1" style="font-size: 1.4rem;">Categorías</h2>
                    <p class="text-muted mb-0">Organiza tu catálogo de productos</p>
                </div>
                <button class="btn btn-neon" data-bs-toggle="modal" data-bs-target="#modalNueva">
                    <i class="bi bi-plus-circle me-1"></i>Nueva categoría
                </button>
            </div>

            <div class="dash-panel p-0">
                <div class="table-responsive">
                    <table class="table gs-table mb-0">
                        <thead>
                            <tr>
                                <th style="width: 80px;">ID</th>
                                <th>Nombre</th>
                                <th class="text-end" style="width: 200px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${categorias}">
                                <td><span class="text-muted" th:text="'#' + ${c.id}">#0</span></td>
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="stat-icon" style="background: var(--accent-soft); color: var(--accent-2); width: 38px; height: 38px; font-size: 1rem;">
                                            <i class="bi bi-tag-fill"></i>
                                        </div>
                                        <span class="fw-bold" th:text="${c.nombre}">Nombre</span>
                                    </div>
                                </td>
                                <td class="text-end">
                                    <div class="d-flex gap-1 justify-content-end">
                                        <button class="btn btn-neon-outline btn-neon-sm"
                                                data-bs-toggle="modal"
                                                th:data-bs-target="'#editar-' + ${c.id}">
                                            <i class="bi bi-pencil"></i>
                                        </button>
                                        <form th:action="@{/admin/categorias/{id}/eliminar(id=${c.id})}" method="post"
                                              onsubmit="return confirm('¿Eliminar categoría?');">
                                            <button type="submit" class="btn btn-neon-outline btn-neon-sm"
                                                    style="border-color: #fecaca; color: #dc2626;">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(categorias)}">
                                <td colspan="3" class="text-center text-muted py-5">
                                    <i class="bi bi-tags" style="font-size: 2.5rem; opacity: .5;"></i>
                                    <div class="mt-2">No hay categorías registradas</div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Modales editar -->
            <div th:each="c : ${categorias}" class="modal fade" th:id="'editar-' + ${c.id}" tabindex="-1">
                <div class="modal-dialog">
                    <form th:action="@{/admin/categorias/{id}/actualizar(id=${c.id})}" method="post">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>Editar categoría</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control gs-form-control" name="nombre" th:value="${c.nombre}" required>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-neon-outline btn-neon-sm" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-neon"><i class="bi bi-check2 me-1"></i>Guardar</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Modal nueva -->
            <div class="modal fade" id="modalNueva" tabindex="-1">
                <div class="modal-dialog">
                    <form th:action="@{/admin/categorias/crear}" method="post">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title"><i class="bi bi-plus-circle me-2"></i>Nueva categoría</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <label class="form-label">Nombre *</label>
                                <input type="text" class="form-control gs-form-control" name="nombre"
                                       placeholder="Ej: Consolas, Periféricos..." required>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-neon-outline btn-neon-sm" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-neon"><i class="bi bi-plus-circle me-1"></i>Crear</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
