spring.application.name=gamerstore
spring.profiles.active=local

server.port=8080

# ===== MariaDB (XAMPP / phpMyAdmin) =====
# El driver mysql-connector-j es compatible con MariaDB porque MariaDB es un fork de MySQL.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/tienda_pc?useSSL=false&sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# ===== Hibernate / JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ===== GamerStore: configuracion de tienda =====
app.tienda.nombre=GamerStore
app.whatsapp.numero=51986969024

# ===== CORS =====
# Origen del front en desarrollo (Vite). En produccion se sirve desde el mismo origen.
app.cors.allowed-origins=http://localhost:5173

# ===== Seguridad JWT =====
app.jwt.secret=GamerStore2026ClaveSecretaHS256MuyLargaParaFirmarTokensSegura!!
app.jwt.access-expiration-ms=300000
app.jwt.refresh-expiration-ms=604800000

# ===== Subida de imágenes (se guardan en el proyecto, no en la BD) =====
app.uploads.dir=uploads/productos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== apiperu.dev (RENIEC/DNI - datos reales de clientes) =====
# NOTA: token sensible. Para repos públicos, moverlo a variable de entorno
# (p. ej. app.apidevperu.token=${APIDEVPERU_TOKEN}).
app.apidevperu.enabled=true
app.apidevperu.base-url=https://apiperu.dev/api
app.apidevperu.token=${APIDEVPERU_TOKEN:}

# ===== Pasarela de pagos (Yape) =====
app.yape.numero=912073109
app.yape.titular=Dietri Josue Diaz Asto
app.yape.qr=/images/qr/yape-qr.jpg
app.yape.monto-maximo=500

# ===== Bloqueo de login (anti fuerza bruta) =====
app.login.max-intentos=3
app.login.bloqueo-segundos=30

# ===== Pasarela real: Stripe (modo PRUEBA - no cobra dinero real) =====
# NOTA: la clave secreta es sensible. Para un repo publico usar variable de entorno:
# app.stripe.secret-key=${STRIPE_SECRET_KEY}
app.stripe.enabled=true
app.stripe.public-key=${STRIPE_PUBLIC_KEY:}
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.currency=pen

# ===== Comprobantes (boleta de venta) - datos DEMO del emisor =====
app.empresa.razon-social=GamerStore S.A.C.
app.empresa.ruc=20601234567
app.empresa.direccion=Av. Javier Prado Este 4200, Santiago de Surco - Lima
app.comprobante.serie=B001
app.comprobante.igv=0.18
