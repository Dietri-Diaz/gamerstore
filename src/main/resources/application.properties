spring.application.name=gamerstore
server.port=8080

# ===== MariaDB (XAMPP / phpMyAdmin) =====
# El driver mysql-connector-j es compatible con MariaDB porque MariaDB es un fork de MySQL.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/tienda_pc?useSSL=false&sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# ===== Hibernate / JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===== GamerStore: configuracion de tienda =====
app.tienda.nombre=GamerStore
app.whatsapp.numero=51986969024

# ===== CORS =====
# Origen del front en desarrollo (Vite). En produccion se sirve desde el mismo origen.
app.cors.allowed-origins=http://localhost:5173
