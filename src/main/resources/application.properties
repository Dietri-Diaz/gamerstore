spring.application.name=gamerstore
server.port=8080

# ===== MariaDB (XAMPP / phpMyAdmin) =====
# El driver mysql-connector-j es compatible con MariaDB porque MariaDB es un fork de MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_pc?useSSL=false&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# ===== Hibernate / JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ===== Thymeleaf =====
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.web.resources.static-locations=classpath:/static/

# ===== GamerStore: configuracion de tienda =====
app.tienda.nombre=GamerStore
app.whatsapp.numero=51986969024
