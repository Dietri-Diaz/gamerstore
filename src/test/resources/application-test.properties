# Perfil de test: base de datos H2 en memoria (no necesita XAMPP/MySQL).
spring.datasource.url=jdbc:h2:mem:gamerstore_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
app.jwt.secret=GamerStore2026ClaveSecretaHS256MuyLargaParaFirmarTokensSegura!!
app.jwt.access-expiration-ms=300000
app.jwt.refresh-expiration-ms=604800000
app.uploads.dir=uploads/productos
app.apidevperu.enabled=false
app.apidevperu.base-url=https://apiperu.dev/api
app.apidevperu.token=

# ===== Pasarela de pagos (Yape) =====
app.yape.numero=986969024
app.yape.titular=GamerStore
app.yape.qr=/images/qr/yape-qr.png
app.yape.monto-maximo=500

# ===== Bloqueo de login (anti fuerza bruta) =====
app.login.max-intentos=3
app.login.bloqueo-segundos=30

# ===== Pasarela real: Stripe (deshabilitada en tests para no llamar a la red) =====
app.stripe.enabled=false
app.stripe.public-key=
app.stripe.secret-key=
app.stripe.currency=pen

